{% set name = "pyts" %}
{% set version = "0.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c0c64ea62bc7e336a9ce1d61fc34182593b3c164662550c600f179d591798343

build:
  number: 0
  # pyproject.toml: requires-python >=3.11,<3.16
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
    - numpy >=1.24.0
    - scipy >=1.15.0
    - scikit-learn >=1.6.0
    - joblib >=1.3.0
    - numba >=0.60.0
    - platformdirs >=4.0.0

test:
  imports:
    - pyts
    - pyts.approximation
    - pyts.bag_of_words
    - pyts.classification
    - pyts.datasets
    - pyts.decomposition
    - pyts.image
    - pyts.metrics
    - pyts.multivariate
    - pyts.multivariate.classification
    - pyts.multivariate.image
    - pyts.multivariate.transformation
    - pyts.multivariate.utils
    - pyts.preprocessing
    - pyts.transformation
    - pyts.utils
  commands:
    - pip check
    - pytest -vv --pyargs pyts
  requires:
    - pip
    - pytest

about:
  home: https://github.com/johannfaouzi/pyts
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A Python package for time series classification
  description: |
    pyts is a Python package for time series transformation and classification.
    It aims to make time series classification easily accessible by providing
    preprocessing and utility tools, and implementations of state-of-the-art
    algorithms. Most of these algorithms transform time series, thus pyts
    provides several tools to perform these transformations.
  doc_url: https://pyts.readthedocs.io
  dev_url: https://github.com/johannfaouzi/pyts

extra:
  recipe-maintainers:
    - johannfaouzi
